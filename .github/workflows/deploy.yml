name: Deploy UptimeFlare Distributed
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: uptimeflare-distributed
      D1_DATABASE: uptimeflare-distributed-d1
      STATUS_DOMAIN: status.catxxp123.top
      DNS_ZONE: catxxp123.top
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: worker
      - run: npm test && npm run typecheck
        working-directory: worker
      - run: node --test util/*.test.cjs
      - run: npm run lint
      - run: npm run build
      - run: npm run build:worker
      - name: Verify management API in the unified Worker artifact
        run: node scripts/management-smoke.mjs
      - name: Verify dashboard scale and lazy history in the unified Worker artifact
        run: node scripts/dashboard-smoke.mjs
      - name: Verify public cached dashboard without D1 and authentication boundaries
        run: node scripts/public-cache-smoke.mjs
      - name: Verify real Coordinator and regional DO RPC, replay and reconstruction
        run: node scripts/coordinator-smoke.mjs
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: unified-static-assets
          retention-days: 1
          path: out/
          include-hidden-files: true
  deploy:
    needs: verify
    if: vars.UNIFIED_DEPLOY_APPROVED == '1'
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: uptimeflare-distributed
      D1_DATABASE: uptimeflare-distributed-d1
      STATUS_DOMAIN: status.catxxp123.top
      DNS_ZONE: catxxp123.top
      UNIFIED_DEPLOY_APPROVED: '1'
      STATE_STORAGE_VERSION: '2'
      CRON_ENABLED: ${{ vars.CRON_ENABLED || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: worker
      - uses: actions/download-artifact@v4
        with:
          name: unified-static-assets
          path: out/
      - name: Prepare unified bindings and deployment config
        run: python3 deploy/provision.py prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_TOKENS: ${{ secrets.PROBE_TOKENS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          PUBLIC_KV_ENABLED: ${{ vars.PUBLIC_KV_ENABLED || '0' }}
          D1_VERIFIED_SCHEMA_HASH: ${{ vars.D1_VERIFIED_SCHEMA_HASH }}
          D1_VERIFIED_DATABASE_ID: ${{ vars.D1_VERIFIED_DATABASE_ID }}
      - name: Deploy scheduled Worker
        working-directory: worker
        run: npx --no-install wrangler deploy --config wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Store Worker secrets
        working-directory: worker
        run: |
          python3 - <<'PY' | npx --no-install wrangler secret bulk --config wrangler.deploy.json
          import json, os
          print(json.dumps({key: os.environ[key] for key in ['PROBE_TOKENS', 'ADMIN_PASSWORD', 'ADMIN_SESSION_SECRET']}))
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_TOKENS: ${{ secrets.PROBE_TOKENS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      - name: Bind status domain
        run: python3 deploy/provision.py domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
