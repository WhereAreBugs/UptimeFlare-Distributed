name: Deploy UptimeFlare Distributed
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_PROJECT: uptimeflare-distributed
      WORKER_NAME: uptimeflare-distributed-worker
      D1_DATABASE: uptimeflare-distributed-d1
      STATUS_DOMAIN: status.catxxp123.top
      DNS_ZONE: catxxp123.top
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: worker
      - run: npm test && npm run typecheck
        working-directory: worker
      - run: node --test util/*.test.cjs
      - run: npm run lint
      - run: npx --no-install @cloudflare/next-on-pages
      - name: Verify management API in the Pages deployment artifact
        run: node scripts/management-smoke.mjs
      - name: Prepare shared D1, Pages bindings and deployment config
        run: python3 deploy/provision.py prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_TOKENS: ${{ secrets.PROBE_TOKENS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      - name: Deploy scheduled Worker
        working-directory: worker
        run: npx --no-install wrangler deploy --config wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Store Worker secrets
        working-directory: worker
        run: |
          python3 - <<'PY' | npx --no-install wrangler secret bulk --config wrangler.deploy.json
          import json, os
          print(json.dumps({key: os.environ[key] for key in ['PROBE_TOKENS', 'ADMIN_PASSWORD', 'ADMIN_SESSION_SECRET']}))
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_TOKENS: ${{ secrets.PROBE_TOKENS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      - name: Publish production Pages
        run: npx --no-install wrangler pages deploy .vercel/output/static --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Reconcile daily history after producer deployment
        run: python3 deploy/provision.py reconcile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Bind status domain
        run: python3 deploy/provision.py domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
