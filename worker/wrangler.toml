name = "uptimeflare_worker"
main = "src/index.ts"
compatibility_date = "2025-04-02"
compatibility_flags = [ "nodejs_compat" ]

[[d1_databases]]
binding = "UPTIMEFLARE_D1"
database_name = "uptimeflare_d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

[assets]
directory = "../out"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[durable_objects]
bindings = [{ name = "REMOTE_CHECKER_DO", class_name = "RemoteChecker" },{ name = "COORDINATOR_DO", class_name = "Coordinator" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RemoteChecker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Coordinator"]

[vars]
STATE_STORAGE_VERSION = "2"
PACKED_PROBE_COUNTERS = "1"
METRICS_ENABLED = "0"

[triggers]
crons = ["* * * * *"]
